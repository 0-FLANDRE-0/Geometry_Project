<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d171a">
<title>Geometry Project · Arena 01</title>
<style>
:root {
  color-scheme: dark;
  --ink: #ecf5f2;
  --muted: #a0b3af;
  --mint: #8cebd6;
  --coral: #ffab97;
  --line: #28383a;
  --surface: #101d20;
}
* { box-sizing: border-box; }
body { margin: 0; background: #0c1518; color: var(--ink); font: 14px system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, canvas:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
button:disabled { opacity: .37; cursor: default; }
[hidden] { display: none !important; }
#app { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
#app:fullscreen { width: 100%; height: 100%; background: #0c1518; }
.stage {
  position: absolute; inset: 0; isolation: isolate; overflow: hidden;
  background: radial-gradient(ellipse at 50% 70%,#182a2b 0,#101d20 49%,#0c161a 85%);
}
#arena, #marks, .scene-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#arena { touch-action: none; cursor: grab; }
#arena:active { cursor: grabbing; }
#marks, .scene-canvas { pointer-events: none; }
.view-tools {
  position: absolute; z-index: 2; top: max(10px, env(safe-area-inset-top));
  right: max(10px, env(safe-area-inset-right)); display: grid; gap: 5px;
}
.view-tools .btn { padding: 0 8px; background: #101d20ed; }
.zoom-tools { display: grid; grid-template-columns: repeat(2, minmax(43px,1fr)); gap: 5px; }
.zoom-tools .btn { font-size: 20px; }
.screen-notice {
  position: absolute; z-index: 3; top: max(10px, env(safe-area-inset-top));
  right: calc(max(10px, env(safe-area-inset-right)) + 103px); max-width: min(270px, 55vw);
  padding: 8px 10px; color: var(--coral); background: #101d20f5; border: 1px solid #704b42;
  border-radius: 6px; font-size: 11px;
}
.controls {
  position: absolute; z-index: 2; bottom: max(10px, env(safe-area-inset-bottom));
  left: max(10px, env(safe-area-inset-left)); max-width: calc(100% - 20px);
  pointer-events: none;
}
.hint {
  width: fit-content; max-width: 100%; padding: 5px 8px; margin-bottom: 5px;
  background: #101d20e8; border-radius: 6px; color: #bfceca; font-size: 11px; line-height: 15px;
}
.hint[data-error="true"] { color: #f6d393; }
.bar {
  display: flex; align-items: end; gap: 7px; width: fit-content; padding: 6px;
  background: #101d20ee; border: 1px solid #334647; border-radius: 8px;
  box-shadow: 0 4px 14px #03090c70; pointer-events: auto;
}
.unit-picker { display: flex; gap: 4px; }
.unit-picker .btn { flex: 1; padding-inline: 4px; }
.unit-picker svg { vertical-align: -.05em; }
.unit-picker .btn[aria-pressed="true"] { color: var(--mint); border-color: #76c8b5; background: #223a38; }
.field { display: grid; gap: 4px; }
.field-name { color: #bfceca; font-size: 11px; white-space: nowrap; }
.stepper { display: flex; align-items: center; min-height: 43px; background: #0d171a; border: 1px solid #334647; border-radius: 6px; }
.stepper button { width: 40px; height: 41px; border: 0; border-radius: 5px; background: transparent; font-size: 21px; }
.stepper input {
  appearance: textfield; width: 47px; min-width: 0; padding: 0; height: 40px; border: 0;
  text-align: center; font: 700 15px ui-monospace,monospace; color: var(--mint); background: transparent;
}
.stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { appearance: none; margin: 0; }
.stepper button:active:not(:disabled), .btn:active:not(:disabled) { filter: brightness(.84); }
.actions { display: flex; align-items: center; gap: 5px; }
.btn { min-height: 43px; padding: 0 10px; border-radius: 6px; border: 1px solid #3d5252; background: #1b2b2e; font-weight: 700; font-size: 12px; white-space: nowrap; }
.place { background: var(--mint); border-color: var(--mint); color: #082921; }
.place[data-team="1"] { background: var(--coral); border-color: var(--coral); color: #321b16; }
.launch { background: #223a38; border-color: #54837a; color: #b9f5e7; }
.battle-readout { display: flex; align-items: center; gap: 8px; min-height: 43px; }
.clock { font: 700 18px ui-monospace,monospace; }
.kicker { color: var(--muted); font: 700 9px ui-monospace,monospace; letter-spacing: .10em; white-space: nowrap; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; background: #09141766; }
.result-card {
  padding: 15px 30px 18px; text-align: center; background: #101d20f0; border: 1px solid #58726e;
  border-radius: 9px; box-shadow: 0 8px 35px #03090c9c;
}
.result-card h1 { font-size: clamp(24px, 5vw, 43px); letter-spacing: -.055em; margin: 3px 0 4px; }
.result-card p { margin: 0; color: var(--muted); font-size: 12px; }
.error-card { color: var(--coral); pointer-events: auto; }
@media (orientation: landscape) and (max-width: 950px) {
  .controls { max-width: 178px; }
  .bar { display: grid; width: 178px; }
  .unit-picker { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .unit-picker .btn { grid-column: span 2; padding-inline: 0; font-size: 11px; }
  .unit-picker .btn:nth-child(n+4) { grid-column: span 3; }
  .field { display: flex; align-items: center; justify-content: space-between; }
  .stepper button { width: 37px; }
  .stepper input { width: 39px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; }
  .place { grid-column: 1 / -1; grid-row: 1; }
}
@media (orientation: portrait) and (max-width: 550px) {
  .bar { flex-wrap: wrap; }
  .unit-picker, .actions { flex-basis: 100%; }
  .actions .btn { flex: 1; }
}
</style>
</head>
<body>
<div id="app">
  <main class="stage" aria-label="훈련장">
    <canvas id="arena" tabindex="0" aria-label="3D 전장. 탭해서 대형 위치 지정. 한 손가락으로 회전, 두 손가락으로 시점 이동과 확대."></canvas>
    <canvas id="marks" aria-hidden="true"></canvas>
    <div class="view-tools" role="group" aria-label="카메라 조작">
      <button class="btn" id="fullscreen" type="button" aria-pressed="false">전체화면</button>
      <div class="zoom-tools">
        <button class="btn" id="zoom-out" type="button" aria-label="시점 축소">−</button>
        <button class="btn" id="zoom-in" type="button" aria-label="시점 확대">+</button>
      </div>
      <button class="btn" id="view-reset" type="button">시점 초기화</button>
    </div>
    <div class="screen-notice" id="screen-notice" role="status" hidden></div>
    <div id="result" class="overlay" hidden>
      <div class="result-card" role="status">
        <div class="kicker">BATTLE COMPLETE</div>
        <h1 id="verdict"></h1>
        <p id="summary"></p>
      </div>
    </div>
    <div id="error" class="overlay" hidden>
      <div class="result-card error-card">이 브라우저에서 전장 화면을 열 수 없어.</div>
    </div>
  </main>
  <footer class="controls">
    <div class="hint" id="hint" aria-live="polite"></div>
    <div class="bar" id="deploy-bar">
      <div class="unit-picker" role="group" aria-label="배치할 유닛">
        <button class="btn" id="unit-circle" type="button" aria-pressed="true">● 원</button>
        <button class="btn" id="unit-triangle" type="button" aria-pressed="false">▲ 삼각형</button>
        <button class="btn" id="unit-square" type="button" aria-pressed="false">■ 사각형</button>
        <button class="btn" id="unit-diamond" type="button" aria-pressed="false">◆ 마름모</button>
        <button class="btn" id="unit-trapezoid" type="button" aria-pressed="false"><svg width="11" height="9" viewBox="0 0 12 10" aria-hidden="true"><path fill="currentColor" d="M2 0h8l2 10H0z"/></svg> 사다리꼴</button>
      </div>
      <div class="field">
        <label class="field-name" for="count">대형 인원</label>
        <div class="stepper">
          <button id="count-down" aria-label="대형 인원 줄이기">−</button>
          <input id="count" type="number" inputmode="numeric" min="1" step="1" value="10">
          <button id="count-up" aria-label="대형 인원 늘리기">+</button>
        </div>
      </div>
      <div class="field">
        <label class="field-name" for="rows">줄 수</label>
        <div class="stepper">
          <button id="rows-down" aria-label="줄 수 줄이기">−</button>
          <input id="rows" type="number" inputmode="numeric" min="1" step="1" value="2">
          <button id="rows-up" aria-label="줄 수 늘리기">+</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="undo">되돌리기</button>
        <button class="btn place" id="place">이 위치에 배치</button>
        <button class="btn launch" id="start">전투 시작</button>
      </div>
    </div>
    <div class="bar" id="battle-bar" hidden>
      <div class="battle-readout"><span class="kicker">전투 시간</span><output id="clock" class="clock">00.0</output></div>
      <div class="actions">
        <button class="btn launch" id="back">다시 배치</button>
      </div>
    </div>
  </footer>
</div>
<script src="./vendor/three-r187.min.js"></script>
<script>
'use strict';
const byId = id => document.getElementById(id);
const ui = Object.fromEntries([
  'arena', 'marks', 'hint', 'unit-circle', 'unit-triangle', 'unit-square', 'unit-diamond', 'unit-trapezoid',
  'count', 'count-down', 'count-up', 'rows', 'rows-down', 'rows-up', 'undo', 'place',
  'start', 'deploy-bar', 'battle-bar', 'back', 'clock', 'result', 'verdict', 'summary', 'error',
  'zoom-out', 'zoom-in', 'view-reset', 'fullscreen', 'screen-notice'
].map(id => [id, byId(id)]));
const circle = Object.freeze({ hp: 200, damage: 75, defense: .10, penetration: 0,
  radius: .5, moveSpeed: 3.06, attackGap: .82, attackRange: 1.0625 });
const triangle = Object.freeze({ hp: 120, damage: 100, defense: 0, penetration: .20,
  radius: circle.radius, moveSpeed: circle.moveSpeed, attackGap: 1.2, attackRange: 10,
  projectileSpeed: circle.moveSpeed * 2 });
const square = Object.freeze({ hp: 265, damage: 40, defense: .40, penetration: 0,
  radius: circle.radius, moveSpeed: 2.98, attackGap: 1, attackRange: circle.attackRange });
const diamond = Object.freeze({ hp: 135, damage: 125, defense: 0, penetration: 0,
  radius: circle.radius, width: .95, length: 1.15, moveSpeed: 7.68, attackGap: 1.1,
  attackRange: circle.attackRange });
const trapezoid = Object.freeze({ hp: 180, damage: 52, defense: .15, penetration: .05,
  radius: circle.radius, width: 1.25, length: 1, moveSpeed: 2.5, attackGap: .90,
  attackRange: 3.25, attackHalfAngle: Math.PI / 3, maxTargets: 3 });
const unitTypes = Object.freeze({circle, triangle, square, diamond, trapezoid});
const trapezoidCorners = [[-.68, 1], [.68, 1], [1, -1], [-1, -1]];
const projectileRadius = .16;
const arena = { x: 35, z: 35 };
const spacing = 1.5;
const deploy = {type: 'circle', count: 10, rows: 2, anchor: null, groups: [], units: [], ready: false, preview: null};
const state = {phase: 'deploy', elapsed: 0, clockTenths: -1, units: [], projectiles: [], alive: [0, 0]};
const clamp = (n, lo, hi) => Math.max(lo, Math.min(n, hi));
const distance2 = (a, b) => (a.x - b.x) ** 2 + (a.z - b.z) ** 2;
let needsPaint = true;

function onMap({x,z}) {
  return Math.abs(x) <= arena.x && Math.abs(z) <= arena.z;
}
function makePreview() {
  const {anchor, count, rows, type} = deploy;
  if (!anchor) return {units: [], team: null, bounds: null, error: ''};
  const team = anchor.z < 0 ? 1 : 0;
  const spec = unitTypes[type];
  const halfWidth = (Math.ceil(count / rows) - 1) * spacing / 2 + (spec.width ?? 2 * spec.radius) / 2;
  const halfDepth = (rows - 1) * spacing / 2 + (spec.length ?? 2 * spec.radius) / 2;
  if (halfWidth > arena.x || halfDepth * 2 > arena.z) {
    return {units: [], team, bounds: null, error: '대형이 한 구역보다 커. 인원이나 줄 수를 조절해줘.'};
  }
  const bounds = {
    left: anchor.x - halfWidth, right: anchor.x + halfWidth,
    front: anchor.z - halfDepth, back: anchor.z + halfDepth
  };
  const units = [];
  for (let row = 0; row < rows; row++) {
    const cols = Math.floor(count / rows) + Number(row < count % rows);
    for (let col = 0; col < cols; col++) {
      units.push({
        x: anchor.x + (col - (cols - 1) / 2) * spacing,
        z: anchor.z + (row - (rows - 1) / 2) * spacing,
        team, type
      });
    }
  }
  let error = '';
  if (bounds.left < -arena.x || bounds.right > arena.x || bounds.front < -arena.z || bounds.back > arena.z
      || (bounds.front < 0 && bounds.back > 0)) {
    error = '대형 전체를 한 진영의 구역 안에 놓아줘.';
  } else if (units.some(u => deploy.units.some(v => distance2(u, v) < (circle.radius * 2 + .10) ** 2))) {
    error = '기존 유닛과 너무 가까워. 대형을 조금 옮겨줘.';
  }
  return {units, team, bounds, error};
}
function rebuildDeployment() {
  deploy.units = deploy.groups.flatMap(group => group.units);
  deploy.ready = deploy.groups.some(group => group.team === 0) && deploy.groups.some(group => group.team === 1);
}
function updateDeploy() {
  needsPaint = true;
  deploy.preview = makePreview();
  const {units, team, error} = deploy.preview;
  for (const key of ['count', 'rows']) {
    if (document.activeElement !== ui[key]) ui[key].value = deploy[key];
  }
  for (const type of Object.keys(unitTypes)) {
    ui['unit-' + type].setAttribute('aria-pressed', String(deploy.type === type));
  }
  ui['count-down'].disabled = deploy.count <= 1;
  ui['rows-down'].disabled = deploy.rows <= 1;
  ui['rows-up'].disabled = deploy.rows >= deploy.count;
  ui.place.disabled = !units.length || Boolean(error);
  ui.place.textContent = team === null ? '여기에 배치' : team === 0 ? '아군 배치' : '적 배치';
  ui.place.dataset.team = team ?? '';
  ui.undo.disabled = !deploy.groups.length;
  ui.start.disabled = !deploy.ready;
  const hint = error || (deploy.anchor
    ? '미리보기를 잡아 이동 · 빈 곳을 끌어 회전'
    : '맵을 탭해 위치 지정 · 양쪽 배치 후 전투 시작');
  if (ui.hint.textContent !== hint) ui.hint.textContent = hint;
  ui.hint.dataset.error = Boolean(error);
}
function updatePhase() {
  needsPaint = true;
  ui['deploy-bar'].hidden = state.phase !== 'deploy';
  ui['battle-bar'].hidden = state.phase === 'deploy';
  ui.result.hidden = state.phase !== 'result';
  ui.hint.hidden = state.phase !== 'deploy';
  if (state.phase === 'deploy') updateDeploy();
}
function setFormationSize(key, value) {
  if (!Number.isSafeInteger(value) || value < 1) return;
  deploy[key] = value;
  deploy.rows = Math.min(deploy.rows, deploy.count);
  updateDeploy();
}
for (const key of ['count', 'rows']) {
  for (const [suffix, delta] of [['down', -1], ['up', 1]]) {
    ui[key + '-' + suffix].addEventListener('click', () => setFormationSize(key, deploy[key] + delta));
  }
  ui[key].addEventListener('input', () => setFormationSize(key, ui[key].valueAsNumber));
  ui[key].addEventListener('blur', () => { ui[key].value = deploy[key]; });
}
for (const type of Object.keys(unitTypes)) {
  ui['unit-' + type].addEventListener('click', () => {
    deploy.type = type;
    updateDeploy();
  });
}
ui.place.addEventListener('click', () => {
  const {units, team, error} = deploy.preview;
  if (state.phase !== 'deploy' || !units.length || error) return;
  const {anchor, count, rows, type} = deploy;
  deploy.groups.push({anchor, count, rows, units, team, type});
  deploy.anchor = null;
  rebuildDeployment();
  updateDeploy();
});
ui.undo.addEventListener('click', () => {
  const group = deploy.groups.pop();
  if (!group) return;
  deploy.type = group.type;
  deploy.count = group.count;
  deploy.rows = group.rows;
  deploy.anchor = group.anchor;
  rebuildDeployment();
  updateDeploy();
});
ui.start.addEventListener('click', () => {
  if (state.phase !== 'deploy' || !deploy.ready) return;
  state.units = deploy.units.map((unit, id) => ({
    ...unit, id, hp: unitTypes[unit.type].hp, cooldown: 0, hurt: 0, swing: 0, fade: 0,
    vx: 0, vz: 0, aimX: 0, aimZ: 0, heading: unit.team === 0 ? Math.PI : 0
  }));
  state.projectiles = [];
  const allies = state.units.filter(unit => unit.team === 0).length;
  state.alive = [allies, state.units.length - allies];
  state.phase = 'battle';
  state.elapsed = 0;
  state.clockTenths = -1;
  ui.clock.textContent = '00.0';
  updatePhase();
});
ui.back.addEventListener('click', () => {
  state.phase = 'deploy';
  state.units = [];
  state.projectiles = [];
  updatePhase();
});

const contact = circle.radius * 2;
const tick = 1 / 60;
const diamondChaseMargin = 3;
function damageAgainst(attack, target) {
  return attack.damage * (1 - unitTypes[target.type].defense * (1 - attack.penetration));
}
function closestEnemy(unit, living) {
  let best = null, range2 = Infinity;
  for (const target of living) {
    if (target.team === unit.team) continue;
    const d2 = distance2(unit, target);
    if (d2 < range2 - 1e-8) { best = target; range2 = d2; }
  }
  return {target: best, range2};
}
function lowestMaxHpEnemyWithin(unit, living, limit2) {
  let best = null, range2 = Infinity, maxHp = Infinity;
  for (const target of living) {
    if (target.team === unit.team) continue;
    const d2 = distance2(unit, target);
    if (d2 > limit2) continue;
    const hp = unitTypes[target.type].hp;
    if (hp < maxHp || (hp === maxHp && d2 < range2 - 1e-8)) {
      best = target;
      range2 = d2;
      maxHp = hp;
    }
  }
  return {target: best, range2};
}
function moveUnits(living) {
  for (const unit of living) {
    unit.vx = unit.vz = 0;
    const nearest = closestEnemy(unit, living);
    if (!nearest.target) continue;
    const {target, range2} = unit.type === 'diamond'
      ? lowestMaxHpEnemyWithin(unit, living, (Math.sqrt(nearest.range2) + diamondChaseMargin) ** 2)
      : nearest;
    const spec = unitTypes[unit.type];
    if (spec.projectileSpeed || spec.attackHalfAngle || unit.type === 'diamond') {
      unit.heading = Math.atan2(target.x - unit.x, target.z - unit.z);
    }
    if (range2 <= spec.attackRange ** 2) continue;
    const range = Math.sqrt(range2);
    let dx = (target.x - unit.x) / range;
    let dz = (target.z - unit.z) / range;
    let forward = 1.42, side = 0;
    for (const other of living) {
      if (other.team !== unit.team || unit === other) continue;
      const rx = other.x - unit.x, rz = other.z - unit.z;
      const along = rx * dx + rz * dz;
      const lateral = -rx * dz + rz * dx;
      if (along > .035 && along < forward && Math.abs(lateral) < contact * .88) {
        forward = along;
        side = Math.abs(lateral) > .018 ? -Math.sign(lateral) : (unit.id % 2 ? 1 : -1);
      }
    }
    if (side) [dx, dz] = [dx - dz * side * .82, dz + dx * side * .82];
    const stopRange = spec.projectileSpeed || spec.attackHalfAngle ? spec.attackRange : contact;
    const step = Math.min(spec.moveSpeed * tick, range - stopRange) / Math.hypot(dx, dz);
    unit.vx = dx * step;
    unit.vz = dz * step;
    if (unit.type === 'diamond') unit.heading = Math.atan2(unit.vx, unit.vz);
  }
  for (const unit of living) { unit.x += unit.vx; unit.z += unit.vz; }
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < living.length; i++) {
      const a = living[i];
      for (let j = i + 1; j < living.length; j++) {
        const b = living[j];
        const dx = b.x - a.x, dz = b.z - a.z;
        const d2 = dx * dx + dz * dz;
        if (d2 >= contact * contact) continue;
        const distance = Math.sqrt(d2);
        const amount = (contact - distance) * .5;
        const sx = distance > 1e-8 ? dx / distance * amount : amount;
        const sz = distance > 1e-8 ? dz / distance * amount : 0;
        a.x -= sx; a.z -= sz; b.x += sx; b.z += sz;
      }
    }
    for (const u of living) {
      u.x = clamp(u.x, -arena.x + circle.radius, arena.x - circle.radius);
      u.z = clamp(u.z, -arena.z + circle.radius, arena.z - circle.radius);
    }
  }
}
function firstProjectileHit(projectile, distance, living) {
  let target = null, closest = Infinity;
  for (const unit of living) {
    if (unit.team === projectile.team) continue;
    const dx = unit.x - projectile.x, dz = unit.z - projectile.z;
    const along = dx * projectile.dx + dz * projectile.dz;
    const across = dx * projectile.dz - dz * projectile.dx;
    const radius = unitTypes[unit.type].radius + projectileRadius;
    const chord2 = radius ** 2 - across ** 2;
    if (chord2 < 0) continue;
    const halfChord = Math.sqrt(chord2);
    if (along + halfChord < 0 || along - halfChord > distance) continue;
    const entry = Math.max(0, along - halfChord);
    if (entry < closest) {
      target = unit;
      closest = entry;
    }
  }
  return target;
}

function advanceProjectiles(living, damage) {
  if (!state.projectiles.length) return;
  state.projectiles = state.projectiles.filter(projectile => {
    const distance = Math.min(projectile.remaining, projectile.attack.projectileSpeed * tick);
    const target = firstProjectileHit(projectile, distance, living);
    if (target) {
      damage[target.id] += damageAgainst(projectile.attack, target);
      return false;
    }
    projectile.x += projectile.dx * distance;
    projectile.z += projectile.dz * distance;
    projectile.remaining -= distance;
    return projectile.remaining > 1e-8;
  });
}

function sweepAttack(unit, spec, living, damage) {
  const hits = [];
  const range2 = spec.attackRange ** 2;
  const cosHalfAngle = Math.cos(spec.attackHalfAngle);
  for (const target of living) {
    if (target.team === unit.team) continue;
    const dx = target.x - unit.x, dz = target.z - unit.z;
    const d2 = dx * dx + dz * dz;
    if (d2 > range2) continue;
    const forward = dx * unit.aimX + dz * unit.aimZ;
    if (forward >= Math.sqrt(d2) * cosHalfAngle - 1e-8) hits.push({target, d2});
  }
  hits.sort((a, b) => a.d2 - b.d2);
  for (const {target} of hits.slice(0, spec.maxTargets)) {
    damage[target.id] += damageAgainst(spec, target);
  }
}

function simulate() {
  state.elapsed += tick;
  const living = state.units.filter(unit => unit.hp > 0);
  moveUnits(living);
  const damage = new Float32Array(state.units.length);
  advanceProjectiles(living, damage);
  for (const unit of living) {
    unit.cooldown = Math.max(0, unit.cooldown - tick);
    if (unit.cooldown > 1e-8) continue;
    const spec = unitTypes[unit.type];
    const attackRange2 = spec.attackRange ** 2;
    const {target, range2} = unit.type === 'diamond'
      ? lowestMaxHpEnemyWithin(unit, living, attackRange2)
      : closestEnemy(unit, living);
    if (!target || range2 > attackRange2) continue;
    unit.cooldown = spec.attackGap;
    if (spec.projectileSpeed) {
      const heading = Math.atan2(target.x - unit.x, target.z - unit.z);
      unit.heading = heading;
      state.projectiles.push({
        x: unit.x, z: unit.z, team: unit.team, heading,
        dx: Math.sin(heading), dz: Math.cos(heading),
        remaining: spec.attackRange, attack: spec
      });
    } else {
      const distance = Math.max(Math.sqrt(range2), .001);
      unit.aimX = (target.x - unit.x) / distance;
      unit.aimZ = (target.z - unit.z) / distance;
      unit.swing = .16;
      if (spec.attackHalfAngle || unit.type === 'diamond') unit.heading = Math.atan2(unit.aimX, unit.aimZ);
      if (spec.attackHalfAngle) sweepAttack(unit, spec, living, damage);
      else damage[target.id] += damageAgainst(spec, target);
    }
  }
  for (const unit of living) {
    if (!damage[unit.id]) continue;
    unit.hp = Math.max(0, unit.hp - damage[unit.id]);
    unit.hurt = .18;
    if (unit.hp === 0) {
      unit.fade = .23;
      state.alive[unit.team]--;
    }
  }
  const tenths = Math.floor(state.elapsed * 10);
  if (tenths !== state.clockTenths) {
    state.clockTenths = tenths;
    ui.clock.textContent = (tenths / 10).toFixed(1).padStart(4, '0');
  }
  const [allies, enemies] = state.alive;
  if ((allies && enemies) || state.projectiles.length) return;
  state.phase = 'result';
  ui.verdict.textContent = allies ? '아군 승리' : enemies ? '적군 승리' : '무승부';
  ui.summary.textContent = ui.clock.textContent + '초';
  updatePhase();
}

const overhead = Math.PI / 2;

const maxZoom = 10;
const camera = {
  w: 1, h: 1, dpr: 1, scale: 1, centerY: 0, yaw: 0, pitch: overhead, zoom: 1,
  targetX: 0, targetZ: 0, sinYaw: 0, cosYaw: 1, sin: 1, cos: 0
};
function updateCamera() {

  camera.cosYaw = Math.cos(camera.yaw);

}

  ctx.moveTo(corner.x, corner.y);
  for (const [x, z] of [[x1, z0], [x1, z1], [x0, z1]]) {
    const p = project(x, y, z);
    ctx.lineTo(p.x, p.y);

ui['view-reset'].addEventListener('click', () => {
  camera.yaw = camera.targetX = camera.targetZ = 0;
  camera.pitch = overhead;
  camera.zoom = 1;

const pointers = new Map();
let multiTouch = false;
let touchView = null;

  const box = ui.arena.getBoundingClientRect();
  return {x: x - box.left, y: y - box.top};
}
function eventGround(event) {
  const screen = viewportPoint(event.clientX, event.clientY);
  return groundPoint(screen.x, screen.y);
}
function setAnchor(x, z) {
  deploy.anchor = {x: Math.round(x * 4) / 4, z: Math.round(z * 4) / 4};
  updateDeploy();
}
function onPreview(screen, ground) {
  const bounds = deploy.preview?.bounds;

  const contains = ({x,z}) => x >= bounds.left - .5 && x <= bounds.right + .5

  const bodyHeightOnScreen = .48 * camera.cos * camera.scale;

  const canPlace = state.phase === 'deploy' && event.button === 0 && !event.shiftKey && onMap(ground);
  const pan = event.button === 1 || event.shiftKey;
  const grabbed = canPlace && onPreview(screen, ground) ? deploy.anchor : null;

    x: event.clientX, y: event.clientY, startX: event.clientX, startY: event.clientY,

    touchView = {
      distance: Math.max(12, Math.hypot(point.x - first.x, point.y - first.y)),
      zoom: camera.zoom,

ui.arena.addEventListener('pointermove', event => {
  const point = pointers.get(event.pointerId);

  const x = event.clientX, y = event.clientY;
  if (pointers.size === 2) {
    const other = [...pointers.values()].find(p => p !== point);
    const distance = Math.max(12, Math.hypot(x - other.x, y - other.y));
    const center = viewportPoint((x + other.x) / 2, (y + other.y) / 2);
    camera.zoom = clamp(touchView.zoom * distance / touchView.distance, .65, maxZoom);
    updateCamera();
    const ground = groundPoint(center.x, center.y);

    point.dragged = true;
    if (point.grabbed && state.phase === 'deploy') {
      const ground = eventGround(event);
      setAnchor(point.grabbed.x + ground.x - point.ground.x, point.grabbed.z + ground.z - point.ground.z);

      const ground = eventGround(event);
      if (onMap(ground)) setAnchor(ground.x, ground.z);

    pointers.delete(event.pointerId);
    if (!pointers.size) {

      touchView = null;

  event.preventDefault();

  turnCamera(0, 0, Math.exp(-clamp(event.deltaY * unit, -160, 160) * .0025),
    viewportPoint(event.clientX, event.clientY));

  if (event.key === 'Enter' && state.phase === 'deploy' && !deploy.anchor) {
    event.preventDefault();

function syncThreeCamera(view) {
  const distance = 120;
  view.position.set(
    camera.targetX + distance * camera.cos * camera.sinYaw,
    distance * camera.sin,
    camera.targetZ + distance * camera.cos * camera.cosYaw
  );
  view.up.set(-camera.sinYaw * camera.sin, camera.cos, -camera.cosYaw * camera.sin);
  view.lookAt(camera.targetX, 0, camera.targetZ);
  const halfWidth = camera.w / (2 * camera.scale);
  const halfHeight = camera.h / (2 * camera.scale);
  const yOffset = (camera.centerY - camera.h / 2) / camera.scale;
  view.left = -halfWidth;
  view.right = halfWidth;
  view.top = halfHeight + yOffset;
  view.bottom = -halfHeight + yOffset;
  view.updateProjectionMatrix();
}

function createThreeScene(three, context) {
  const renderer = new three.WebGLRenderer({canvas: context.canvas, context, alpha: true, antialias: true});
  renderer.setClearColor(0x000000, 0);
  const scene = new three.Scene();
  const view = new three.OrthographicCamera(-1, 1, 1, -1, .1, 260);
  scene.add(new three.AmbientLight(0xffffff, .9));
  const sunlight = new three.DirectionalLight(0xffffff, 1.15);
  sunlight.position.set(-.46, .82, -.34);
  scene.add(sunlight);

  const squareBody = new three.CylinderGeometry(1, 1, 1, 4, 1, false, Math.PI / 4).translate(0, .5, 0);
  const squareCap = new three.CircleGeometry(1, 4, -Math.PI / 4).rotateX(-Math.PI / 2);
  function trapezoidGeometry(squareGeometry) {
    const geometry = squareGeometry.toNonIndexed();
    const positions = geometry.getAttribute('position');
    for (let i = 0; i < positions.count; i++) {
      const side = Math.sign(positions.getX(i));
      if (!side) continue;
      const front = positions.getZ(i) > 0;
      positions.setX(i, side * (front ? trapezoidCorners[1][0] : 1));
      positions.setZ(i, front ? 1 : -1);
    }
    geometry.computeVertexNormals();
    return geometry;
  }
  const geometries = {
    plane: new three.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
    body: new three.CylinderGeometry(1, 1, 1, 28).translate(0, .5, 0),
    disk: new three.CircleGeometry(1, 28).rotateX(-Math.PI / 2),
    triangle: new three.CylinderGeometry(1, 1, 1, 3).translate(0, .5, 0),
    'triangle-cap': new three.CircleGeometry(1, 3, -Math.PI / 2).rotateX(-Math.PI / 2),
    square: squareBody,
    'square-cap': squareCap,
    diamond: new three.CylinderGeometry(1, 1, 1, 4).translate(0, .5, 0),
    'diamond-cap': new three.CircleGeometry(1, 4, -Math.PI / 2).rotateX(-Math.PI / 2),
    trapezoid: trapezoidGeometry(squareBody),
    'trapezoid-cap': trapezoidGeometry(squareCap)

  const pools = new Map();
  return {
    resize() { renderer.setDrawingBufferSize(camera.w, camera.h, camera.dpr); },
    begin() { for (const pool of pools.values()) pool.used = 0; },
    draw(shape, x, y, z, sx, sy, sz, color, lit = 0, heading = 0) {
      const opacity = color[3] ?? 1;
      const transparent = opacity < 1;
      const key = shape + ':' + lit + ':' + transparent;
      if (!pools.has(key)) pools.set(key, {used: 0, meshes: []});
      const pool = pools.get(key);
      let mesh = pool.meshes[pool.used++];
      if (!mesh) {
        const Material = lit ? three.MeshLambertMaterial : three.MeshBasicMaterial;
        mesh = new three.Mesh(geometries[shape], new Material({transparent, depthWrite: !transparent}));
        pool.meshes.push(mesh);
        scene.add(mesh);
      }
      mesh.visible = true;
      mesh.position.set(x, y, z);
      mesh.rotation.y = heading;
      mesh.scale.set(sx, sy || 1, sz);
      mesh.material.color.setRGB(color[0], color[1], color[2], three.SRGBColorSpace);
      mesh.material.opacity = opacity;
    },
    end() {
      for (const pool of pools.values()) {
        for (let i = pool.used; i < pool.meshes.length; i++) pool.meshes[i].visible = false;
      }
      syncThreeCamera(view);
      renderer.render(scene, view);
    }
  };
}

function createGraphicsScene() {
  const three = globalThis.THREE;
  if (three) {
    // Keep the input canvas available for the Canvas fallback.
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('webgl2', {alpha: true, antialias: true});
    if (context) {
      try {
        const scene = createThreeScene(three, context);
        canvas.className = 'scene-canvas';
        canvas.setAttribute('aria-hidden', 'true');
        ui.arena.before(canvas);
        return scene;
      } catch (error) {
        console.warn('Three.js initialization failed. Switching to Canvas.', error);
      }
    }
  }
  const fallback = ui.arena.getContext('2d');
  if (!fallback) throw new Error('No graphics context is available.');
  return createCanvasScene(fallback);
}

function fillPolygon(ctx, points) {
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  ctx.fill();
}

function createCanvasScene(ctx) {
  function rgba(color, shade = 1) {
    const [r, g, b, a = 1] = color;
    return 'rgba(' + [r, g, b].map(channel => Math.round(channel * shade * 255)).join(',') + ',' + a + ')';
  }
  return {
    resize() {
      ctx.canvas.width = Math.round(camera.w * camera.dpr);
      ctx.canvas.height = Math.round(camera.h * camera.dpr);
    },
    begin() {
      ctx.setTransform(camera.dpr, 0, 0, camera.dpr, 0, 0);
      ctx.clearRect(0, 0, camera.w, camera.h);
    },
    draw(shape, x, y, z, sx, sy, sz, color, lit = 0, heading = 0) {
      const base = project(x,y,z);
      const rx = sx * camera.scale;
      const rz = sz * camera.scale * camera.sin;
      if (shape === 'plane') {
        ctx.fillStyle = rgba(color);
        groundRectangle(ctx, x - sx / 2, z - sz / 2, x + sx / 2, z + sz / 2, y);
        ctx.fill();

      }

      const isDiamond = shape === 'diamond' || shape === 'diamond-cap';

        const firstCorner = isSquare ? Math.PI / 4 : 0;
        const sinHeading = Math.sin(heading), cosHeading = Math.cos(heading);

          const angle = firstCorner + i * 2 * Math.PI / sides;
          const px = sx * (isTrapezoid ? trapezoidCorners[i][0] : Math.sin(angle));
          const pz = sz * (isTrapezoid ? trapezoidCorners[i][1] : Math.cos(angle));

        if (!shape.endsWith('-cap')) {
          ctx.fillStyle = rgba(color, lit ? .74 : .85);
          for (let i = 0; i < corners.length; i++) {
            const j = (i + 1) % corners.length;
            const a = corners[i], b = corners[j];
            const facing = (a.x + b.x - 2 * x) * camera.sinYaw + (a.z + b.z - 2 * z) * camera.cosYaw;
            if (facing > 0) fillPolygon(ctx, [tops[i], tops[j], project(b.x,y,b.z), project(a.x,y,a.z)]);
          }

        ctx.fillStyle = rgba(color, lit ? .935 : 1);

      const top = project(x,y+sy,z);

        const shade = ctx.createLinearGradient(top.x - rx, 0, top.x + rx, 0);
        shade.addColorStop(0, rgba(color, .85));
        shade.addColorStop(1, rgba(color, .65));
        ctx.fillStyle = shade;
        ctx.beginPath();
        ctx.ellipse(top.x, top.y, rx, rz, 0, Math.PI, 0, true);
        ctx.ellipse(base.x, base.y, rx, rz, 0, 0, Math.PI);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = rgba(color, lit ? .935 : 1);
      ctx.beginPath();
      ctx.ellipse(top.x, top.y, rx, rz, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  };
}

    const size = cornerScale * (model.hp === 0 ? .55 + .45 * life : 1);
    const halfWidth = (spec.width ?? 2 * spec.radius) / 2 * size;
    const halfLength = (spec.length ?? 2 * spec.radius) / 2 * size;
    const body = model.type === 'circle' ? 'body' : model.type;
    const capShape = model.type === 'circle' ? 'disk' : model.type + '-cap';
    const heading = model.heading ?? (model.team === 0 ? Math.PI : 0);
    const swing = Math.sin((model.swing || 0) / .16 * Math.PI) * .17;
    const x = model.x + (model.aimX || 0) * swing;
    const z = model.z + (model.aimZ || 0) * swing;
    const height = (.40 + swing * .35) * life;
    if (ghost) {
      const tone = allowed ? color.ghost : [1,.77,.38];
      draw(body,x,.025,z,halfWidth,height,halfLength,[...tone,.26],1,heading);
      draw(body,x,height+.025,z,halfWidth * .91,.052,halfLength * .91,[...tone,.80],1,heading);
      draw(capShape,x,height+.081,z,halfWidth * .69,0,halfLength * .69,[.11,.21,.20,.81],0,heading);
      return;
    }
    draw(capShape,x+.10,.021,z+.13,halfWidth * 1.16,0,halfLength * 1.09,[.04,.08,.09,.68 * life],0,heading);
    draw(body,x,.024,z,halfWidth,height,halfLength,[...color.body,life],1,heading);
    draw(body,x,height+.024,z,halfWidth * .94,.079*life,halfLength * .94,[...color.rim,life],1,heading);
    const cap = model.hurt > .08 ? [1,.94,.83] : color.cap;
    draw(capShape,x,height+.105*life,z,halfWidth * .72,0,halfLength * .72,[...cap,life],0,heading);
  }
  return {
    render(units, preview, valid, projectiles) {
      scene.begin();
      for (const floor of slabs) draw('plane',floor.x,floor.y,floor.z,floor.width,1,floor.depth,floor.color);
      const byDepth = (a, b) => (a.x - b.x) * camera.sinYaw + (a.z - b.z) * camera.cosYaw;
      for (const model of [...units].sort(byDepth)) unit(model);
      for (const shot of projectiles) {
        draw('triangle',shot.x,.28,shot.z,projectileRadius,.12,projectileRadius,teams[shot.team].rim,0,shot.heading);
      }
      for (const model of [...preview].sort(byDepth)) unit(model,true,valid);
      scene.end?.();
    }
  };
}

function polygonMark(ctx, model, y, radius, sides, widthRatio = 1) {
  const point = project(model.x, y, model.z);
  const heading = (model.heading ?? (model.team === 0 ? Math.PI : 0)) - camera.yaw;
  const angle = Math.atan2(camera.sin * Math.cos(heading), Math.sin(heading));
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const isTrapezoid = model.type === 'trapezoid';
  const firstCorner = model.type === 'square' ? Math.PI / 4 : 0;
  fillPolygon(ctx, Array.from({length: sides}, (_, i) => {
    const vertex = firstCorner + i * 2 * Math.PI / sides;
    const forward = radius * (isTrapezoid ? trapezoidCorners[i][1] : Math.cos(vertex));
    const side = radius * widthRatio * (isTrapezoid ? trapezoidCorners[i][0] : Math.sin(vertex));
    return {x: point.x + forward * cos - side * sin, y: point.y + forward * sin + side * cos};
  }));
}

function drawMarks(ctx, units, preview, valid, projectiles) {
  ctx.setTransform(camera.dpr, 0, 0, camera.dpr, 0, 0);
  ctx.clearRect(0, 0, camera.w, camera.h);
  ctx.textAlign = 'center';
  for (const unit of units) {
    const spec = unitTypes[unit.type];
    if (!spec.attackHalfAngle || !unit.swing) continue;
    const heading = Math.atan2(unit.aimX, unit.aimZ);
    const fan = [project(unit.x, .06, unit.z)];
    for (let i = 0; i <= 12; i++) {
      const angle = heading + (i / 6 - 1) * spec.attackHalfAngle;
      fan.push(project(unit.x + Math.sin(angle) * spec.attackRange, .06, unit.z + Math.cos(angle) * spec.attackRange));
    }
    ctx.fillStyle = unit.team === 0 ? '#8cebd6' : '#ffab97';
    ctx.globalAlpha = unit.swing / .16 * .28;
    fillPolygon(ctx, fan);
  }
  ctx.globalAlpha = 1;
  if (camera.scale < 4) {
    const radius = Math.max(1.6, circle.radius * camera.scale);
    for (const [models, isPreview] of [[units, false], [preview, true]]) {
      ctx.globalAlpha = isPreview ? .72 : 1;
      for (const model of models) {
        if (model.hp === 0) continue;
        const point = project(model.x, .4, model.z);
        ctx.fillStyle = isPreview && !valid ? '#f6d393' : model.team === 1 ? '#ffab97' : '#8cebd6';
        if (model.type === 'triangle') polygonMark(ctx, model, .4, radius + .35, 3);
        else if (model.type === 'square') polygonMark(ctx, model, .4, radius * Math.SQRT2, 4);
        else if (model.type === 'diamond') polygonMark(ctx, model, .4, radius * diamond.length, 4, diamond.width / diamond.length);
        else if (model.type === 'trapezoid') polygonMark(ctx, model, .4, radius, 4, trapezoid.width);
        else {
          ctx.beginPath();
          ctx.arc(point.x, point.y, radius, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;
  }
  if (projectileRadius * camera.scale < 1.35) {
    for (const shot of projectiles) {
      ctx.fillStyle = shot.team === 0 ? '#abffed' : '#ffd1bf';
      polygonMark(ctx, shot, .40, 1.35, 3);
    }
  }
  if (state.phase === 'deploy') {
    const enemyTag = project(0,0,-arena.z * .74);
    const allyTag = project(0,0,arena.z * .76);
    ctx.font = '700 ' + clamp(camera.scale * .94, 10, 13) + 'px system-ui';
    ctx.fillStyle = '#dcb3aa';
    ctx.fillText('적 배치 구역', enemyTag.x, enemyTag.y);
    ctx.fillStyle = '#9bd5c9';
    ctx.fillText('아군 배치 구역', allyTag.x, allyTag.y);
    const bounds = deploy.preview.bounds;
    if (bounds) {
      ctx.strokeStyle = !valid ? '#f6d393e0' : deploy.preview.team === 1 ? '#ffab97bb' : '#8cebd6bb';
      ctx.setLineDash([4,4]);
      groundRectangle(ctx, bounds.left - .25, bounds.front - .25, bounds.right + .25, bounds.back + .25, 0);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function boot() {
  const scene = createGraphicsScene();
  const renderer = createRenderer(scene);
  const marks = ui.marks.getContext('2d');
  function resize() {
    needsPaint = true;
    const {width, height} = ui.arena.getBoundingClientRect();
    camera.w = Math.max(width, 1);
    camera.h = Math.max(height, 1);
    camera.dpr = Math.min(devicePixelRatio || 1, 2);
    updateCamera();
    scene.resize();
    ui.marks.width = Math.round(camera.w * camera.dpr);
    ui.marks.height = Math.round(camera.h * camera.dpr);
  }
  new ResizeObserver(resize).observe(ui.arena);
  resize();
  let previous = performance.now(), accumulator = 0;
  function frame(now) {
    const dt = Math.min(.5, Math.max(0, (now - previous) / 1000));
    previous = now;
    requestAnimationFrame(frame);
    const animating = state.phase === 'battle'
      || (state.phase === 'result' && state.units.some(unit => unit.fade || unit.hurt || unit.swing));
    if (!needsPaint && !animating) return;
    needsPaint = false;
    if (state.phase === 'battle') {
      accumulator += dt;
      while (state.phase === 'battle' && accumulator >= tick) {
        simulate();
        accumulator -= tick;
      }
    } else accumulator = 0;
    for (const unit of state.units) {
      unit.hurt = Math.max(0, unit.hurt - dt);
      unit.swing = Math.max(0, unit.swing - dt);
      unit.fade = Math.max(0, unit.fade - dt);
    }
    const units = state.phase === 'deploy' ? deploy.units : state.units;
    const preview = state.phase === 'deploy' ? deploy.preview.units : [];
    const valid = state.phase !== 'deploy' || !deploy.preview.error;
    renderer.render(units, preview, valid, state.projectiles);
    drawMarks(marks, units, preview, valid, state.projectiles);
  }
  requestAnimationFrame(frame);
}
updatePhase();
try { boot(); } catch (error) {
  console.error(error);
  ui.error.hidden = false;
  for (const button of document.querySelectorAll('button')) button.disabled = true;
}
</script>
</body>
</html>
