<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d171a">
<title>Geometry Project · Arena 01</title>
<style>
:root {
  color-scheme: dark;
  --ink: #ecf5f2;
  --muted: #a0b3af;
  --mint: #8cebd6;
  --coral: #ffab97;
  --line: #28383a;
  --surface: #101d20;
}
* { box-sizing: border-box; }
body { margin: 0; background: #0c1518; color: var(--ink); font: 14px system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, canvas:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
button:disabled { opacity: .37; cursor: default; }
[hidden] { display: none !important; }
#app { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
#app:fullscreen { width: 100%; height: 100%; background: #0c1518; }
.stage {
  position: absolute; inset: 0; isolation: isolate; overflow: hidden;
  background: radial-gradient(ellipse at 50% 70%,#182a2b 0,#101d20 49%,#0c161a 85%);
}
#arena, #marks, .scene-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#arena { touch-action: none; cursor: grab; }
#arena:active { cursor: grabbing; }
#app[data-terrain="true"] #arena { cursor: crosshair; }
#marks, .scene-canvas { pointer-events: none; }
.view-tools {
  position: absolute; z-index: 2; top: max(10px, env(safe-area-inset-top));
  right: max(10px, env(safe-area-inset-right)); display: grid; gap: 5px;
}
.view-tools .btn { padding: 0 8px; background: #101d20ed; }
.zoom-tools { display: grid; grid-template-columns: repeat(2, minmax(43px,1fr)); gap: 5px; }
.zoom-tools .btn { font-size: 20px; }
.screen-notice {
  position: absolute; z-index: 3; top: max(10px, env(safe-area-inset-top));
  right: calc(max(10px, env(safe-area-inset-right)) + 103px); max-width: min(270px, 55vw);
  padding: 8px 10px; color: var(--coral); background: #101d20f5; border: 1px solid #704b42;
  border-radius: 6px; font-size: 11px;
}
.controls {
  position: absolute; z-index: 2; bottom: max(10px, env(safe-area-inset-bottom));
  left: max(10px, env(safe-area-inset-left)); max-width: calc(100% - 20px);
  pointer-events: none;
}
.hint {
  width: fit-content; max-width: 100%; padding: 5px 8px; margin-bottom: 5px;
  background: #101d20e8; border-radius: 6px; color: #bfceca; font-size: 11px; line-height: 15px;
}
.hint[data-error="true"] { color: #f6d393; }
.bar {
  display: flex; align-items: end; gap: 7px; width: fit-content; padding: 6px;
  background: #101d20ee; border: 1px solid #334647; border-radius: 8px;
  box-shadow: 0 4px 14px #03090c70; pointer-events: auto;
}
.unit-picker { display: flex; gap: 4px; }
.unit-picker .btn { flex: 1; padding-inline: 4px; }
.unit-picker svg { vertical-align: -.05em; }
.unit-picker .btn[aria-pressed="true"] { color: var(--mint); border-color: #76c8b5; background: #223a38; }
.field { display: grid; gap: 4px; }
.field-name { color: #bfceca; font-size: 11px; white-space: nowrap; }
.stepper { display: flex; align-items: center; min-height: 43px; background: #0d171a; border: 1px solid #334647; border-radius: 6px; }
.stepper button { width: 40px; height: 41px; border: 0; border-radius: 5px; background: transparent; font-size: 21px; }
.stepper input {
  appearance: textfield; width: 47px; min-width: 0; padding: 0; height: 40px; border: 0;
  text-align: center; font: 700 15px ui-monospace,monospace; color: var(--mint); background: transparent;
}
.stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { appearance: none; margin: 0; }
.stepper button:active:not(:disabled), .btn:active:not(:disabled) { filter: brightness(.84); }
.actions { display: flex; align-items: center; gap: 5px; }
.btn { min-height: 43px; padding: 0 10px; border-radius: 6px; border: 1px solid #3d5252; background: #1b2b2e; font-weight: 700; font-size: 12px; white-space: nowrap; }
.place { background: var(--mint); border-color: var(--mint); color: #082921; }
.place[data-team="1"] { background: var(--coral); border-color: var(--coral); color: #321b16; }
.launch { background: #223a38; border-color: #54837a; color: #b9f5e7; }
.battle-readout { display: flex; align-items: center; gap: 8px; min-height: 43px; }
.clock { font: 700 18px ui-monospace,monospace; }
.kicker { color: var(--muted); font: 700 9px ui-monospace,monospace; letter-spacing: .10em; white-space: nowrap; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; background: #09141766; }
.result-card {
  padding: 15px 30px 18px; text-align: center; background: #101d20f0; border: 1px solid #58726e;
  border-radius: 9px; box-shadow: 0 8px 35px #03090c9c;
}
.result-card h1 { font-size: clamp(24px, 5vw, 43px); letter-spacing: -.055em; margin: 3px 0 4px; }
.result-card p { margin: 0; color: var(--muted); font-size: 12px; }
.error-card { color: var(--coral); pointer-events: auto; }
.stage-tools {
  position: absolute; z-index: 2; top: max(10px, env(safe-area-inset-top));
  left: max(10px, env(safe-area-inset-left)); max-width: calc(100% - 118px);
  display: grid; justify-items: start; gap: 5px;
}
.stage-tools .btn { min-height: 38px; padding-inline: 9px; }
#terrain-bar { display: flex; flex-wrap: wrap; width: fit-content; }
.stage-tools a.btn { display: inline-flex; align-items: center; color: inherit; text-decoration: none; }
.stage-tools a[aria-disabled="true"] { opacity: .37; cursor: default; }
.stage-tools a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.stage-editor-actions { display: flex; flex-wrap: wrap; gap: 5px; }
.stage-caption {
  max-width: 100%; padding: 4px 8px; border-radius: 5px; background: #101d20ee;
  color: var(--muted); font-size: 11px; overflow-wrap: anywhere;
}
.stage-caption[data-error="true"] { color: #f6d393; }
.stage-dialog {
  width: min(380px, calc(100% - 24px)); max-height: calc(100% - 24px);
  padding: 16px; border: 1px solid #58726e; border-radius: 9px; background: var(--surface); color: var(--ink);
}
.stage-dialog::backdrop { background: #081214b8; }
.stage-dialog h2 { margin: 0 0 12px; font-size: 18px; }
.stage-form { display: grid; gap: 10px; }
.stage-form label { display: grid; gap: 4px; color: #bfceca; font-size: 12px; }
.stage-form input {
  width: 100%; min-height: 38px; padding: 6px 9px; border: 1px solid #3d5252;
  border-radius: 5px; background: #0d171a; color: var(--ink); font: inherit;
}
.stage-form-dimensions { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.stage-form-actions { display: flex; justify-content: flex-end; gap: 6px; }
.stage-form-error { margin: 0; color: #f6d393; font-size: 12px; }
#stage-mirror[aria-pressed="true"], #stage-terrain[aria-pressed="true"], #stage-walls[aria-pressed="true"] {
  color: var(--mint); border-color: #76c8b5; background: #223a38;
}
@media (orientation: landscape) and (max-width: 1370px) {
  .controls { max-width: 330px; }
  .bar { display: grid; width: 330px; }
  .unit-picker { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 46px repeat(2, minmax(0, 1fr)); }
  .unit-picker .btn { padding-inline: 0; font-size: 10.5px; }
  .unit-picker [aria-hidden="true"] { display: none; }
  .field { display: flex; align-items: center; justify-content: space-between; }
  .stepper button { width: 37px; }
  .stepper input { width: 39px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; }
  .place { grid-column: 1 / -1; grid-row: 1; }
  #app:not([data-mode="sandbox"]) #deploy-bar { grid-template-columns: repeat(2, minmax(0,1fr)); }
  #app:not([data-mode="sandbox"]) #deploy-bar .unit-picker,
  #app:not([data-mode="sandbox"]) #deploy-bar .actions { grid-column: 1 / -1; }
  #app:not([data-mode="sandbox"]) #deploy-bar .field { display: grid; }
  #app:not([data-mode="sandbox"]) #deploy-bar .stepper { justify-content: space-between; }
  #app:not([data-mode="sandbox"]) #deploy-bar .actions { display: flex; }
  #app:not([data-mode="sandbox"]) #deploy-bar .btn { min-height: 37px; }
  #app:not([data-mode="sandbox"]) #deploy-bar .actions .btn { flex: 1; padding-inline: 4px; }
}
@media (orientation: portrait) and (max-width: 550px) {
  .bar { flex-wrap: wrap; }
  .unit-picker, .actions { flex-basis: 100%; }
  .unit-picker { flex-wrap: wrap; }
  .actions .btn { flex: 1; }
}
</style>
</head>
<body>
<div id="app" data-mode="sandbox">
  <main class="stage" aria-label="훈련장">
    <canvas id="arena" tabindex="0" aria-label="3D 전장. 탭해서 대형 위치 지정. 한 손가락으로 회전, 두 손가락으로 시점 이동과 확대."></canvas>
    <canvas id="marks" aria-hidden="true"></canvas>
    <div class="stage-tools" role="group" aria-label="스테이지">
      <button class="btn" id="stage-edit" type="button">스테이지 편집</button>
      <div class="stage-editor-actions" id="stage-edit-tools" hidden>
        <button class="btn" id="stage-settings" type="button">맵 설정</button>
        <button class="btn" id="stage-terrain" type="button" aria-pressed="false">바닥 구멍</button>
        <button class="btn" id="stage-walls" type="button" aria-pressed="false">차단벽</button>
        <button class="btn" id="stage-load" type="button">JSON 열기</button>
        <a class="btn" id="stage-save" href="#" download>JSON 저장</a>
        <button class="btn launch" id="stage-test" type="button">시험 배치</button>
        <button class="btn" id="stage-free" type="button">자유 배치</button>
      </div>
      <div class="stage-caption" id="stage-caption" role="status" hidden></div>
      <input id="stage-file" type="file" accept=".json,application/json" hidden>
    </div>
    <div class="view-tools" role="group" aria-label="카메라 조작">
      <button class="btn" id="fullscreen" type="button" aria-pressed="false">전체화면</button>
      <div class="zoom-tools">
        <button class="btn" id="zoom-out" type="button" aria-label="시점 축소">−</button>
        <button class="btn" id="zoom-in" type="button" aria-label="시점 확대">+</button>
      </div>
      <button class="btn" id="view-reset" type="button">시점 초기화</button>
    </div>
    <div class="screen-notice" id="screen-notice" role="status" hidden></div>
    <div id="result" class="overlay" hidden>
      <div class="result-card" role="status">
        <div class="kicker">BATTLE COMPLETE</div>
        <h1 id="verdict"></h1>
        <p id="summary"></p>
      </div>
    </div>
    <div id="error" class="overlay" hidden>
      <div class="result-card error-card">이 브라우저에서 전장 화면을 열 수 없어.</div>
    </div>
  </main>
  <footer class="controls">
    <div class="hint" id="hint" aria-live="polite"></div>
    <div class="bar" id="deploy-bar">
      <div class="unit-picker" role="group" aria-label="배치할 유닛">
        <button class="btn" id="unit-circle" type="button" aria-pressed="true"><span aria-hidden="true">●</span> 원</button>
        <button class="btn" id="unit-triangle" type="button" aria-pressed="false"><span aria-hidden="true">▲</span> 삼각형</button>
        <button class="btn" id="unit-piercing" type="button" aria-label="관통 삼각형" title="관통 삼각형" aria-pressed="false"><svg width="8" height="12" viewBox="0 0 8 12" aria-hidden="true"><path fill="currentColor" d="M4 0 8 12H0z"/></svg> 관통</button>
        <button class="btn" id="unit-spread" type="button" aria-label="분산 삼각형" title="분산 삼각형" aria-pressed="false"><svg width="13" height="8" viewBox="0 0 13 8" aria-hidden="true"><path fill="currentColor" d="M6.5 0 13 8H0z"/></svg> 분산</button>
        <button class="btn" id="unit-square" type="button" aria-pressed="false"><span aria-hidden="true">■</span> 사각형</button>
        <button class="btn" id="unit-trapezoid" type="button" aria-pressed="false"><svg width="11" height="9" viewBox="0 0 12 10" aria-hidden="true"><path fill="currentColor" d="M2 0h8l2 10H0z"/></svg> 사다리꼴</button>
        <button class="btn" id="unit-diamond" type="button" aria-pressed="false"><span aria-hidden="true">◆</span> 마름모</button>
        <button class="btn" id="unit-escort" type="button" aria-label="호위 마름모" title="호위 마름모" aria-pressed="false"><svg width="15" height="9" viewBox="0 0 15 9" aria-hidden="true"><path fill="currentColor" d="M7.5 0 15 4.5 7.5 9 0 4.5z"/></svg> 호위</button>
        <button class="btn" id="unit-bomber" type="button" aria-label="자폭 마름모" title="자폭 마름모" aria-pressed="false"><svg width="7" height="13" viewBox="0 0 7 13" aria-hidden="true"><path fill="currentColor" d="M3.5 0 7 9 3.5 13 0 9z"/></svg> 자폭</button>
        <button class="btn" id="unit-hexagon" type="button" aria-pressed="false"><span aria-hidden="true">⬢</span> 육각형</button>
        <button class="btn" id="unit-fieldHexagon" type="button" aria-label="장판형 육각형" title="장판형 육각형" aria-pressed="false"><span aria-hidden="true">⬡</span> 장판</button>
        <button class="btn" id="unit-pentagon" type="button" aria-pressed="false"><span aria-hidden="true">⬟</span> 오각형</button>
        <button class="btn" id="unit-beamPentagon" type="button" aria-label="직사 레이저형 오각형" title="직사 레이저형 오각형" aria-pressed="false"><svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M6 0 12 4.4 9.7 11.5H2.3L0 4.4zM5 4v5h2V4z" fill-rule="evenodd"/></svg> 직사</button>
        <button class="btn" id="unit-octagon" type="button" aria-pressed="false"><svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M4 0h4l4 4v4l-4 4H4L0 8V4z"/></svg> 팔각형</button>
        <button class="btn" id="unit-wall" type="button" aria-label="방벽 직사각형" title="방벽 직사각형" aria-pressed="false"><span aria-hidden="true">▬</span> 방벽</button>
      </div>
      <div class="field">
        <label class="field-name" for="count">대형 인원</label>
        <div class="stepper">
          <button id="count-down" aria-label="대형 인원 줄이기">−</button>
          <input id="count" type="number" inputmode="numeric" min="1" step="1" value="10">
          <button id="count-up" aria-label="대형 인원 늘리기">+</button>
        </div>
      </div>
      <div class="field">
        <label class="field-name" for="rows">줄 수</label>
        <div class="stepper">
          <button id="rows-down" aria-label="줄 수 줄이기">−</button>
          <input id="rows" type="number" inputmode="numeric" min="1" step="1" value="2">
          <button id="rows-up" aria-label="줄 수 늘리기">+</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="undo">되돌리기</button>
        <button class="btn" id="stage-cancel-group" type="button" hidden>선택 해제</button>
        <button class="btn" id="stage-mirror" type="button" aria-pressed="false" hidden>좌우 미러</button>
        <button class="btn place" id="place">이 위치에 배치</button>
        <button class="btn launch" id="start">전투 시작</button>
      </div>
    </div>
    <div class="bar" id="battle-bar" hidden>
      <div class="battle-readout"><span class="kicker">전투 시간</span><output id="clock" class="clock">00.0</output></div>
      <div class="actions">
        <button class="btn launch" id="back">다시 배치</button>
      </div>
    </div>
    <div class="bar" id="terrain-bar" hidden>
      <button class="btn" id="pit-delete" type="button" disabled>선택한 구멍 삭제</button>
      <button class="btn launch" id="pit-done" type="button">대형 배치로</button>
    </div>
  </footer>
  <dialog class="stage-dialog" id="stage-dialog" aria-labelledby="stage-dialog-title">
    <h2 id="stage-dialog-title">맵 설정</h2>
    <form class="stage-form" id="stage-form">
      <label>스테이지 이름 <input id="stage-name" type="text" maxlength="80" required></label>
      <div class="stage-form-dimensions">
        <label>가로 <input id="stage-width" type="number" min="16" max="160" step="1" inputmode="numeric" required></label>
        <label>세로 <input id="stage-depth" type="number" min="16" max="160" step="1" inputmode="numeric" required></label>
        <label>적 구역 (%) <input id="stage-enemy-percent" type="number" min="15" max="85" step="1" inputmode="numeric" required></label>
      </div>
      <p class="stage-form-error" id="stage-form-error" role="alert" hidden></p>
      <div class="stage-form-actions">
        <button class="btn" id="stage-close-settings" type="button">취소</button>
        <button class="btn launch" type="submit">적용</button>
      </div>
    </form>
  </dialog>
</div>
<script src="./vendor/three-r187.min.js?v=2"></script>
<script>
'use strict';
const byId = id => document.getElementById(id);
const ui = Object.fromEntries([
  'app', 'stage-edit', 'stage-edit-tools', 'stage-caption', 'stage-settings', 'stage-load', 'stage-save', 'stage-test',
  'stage-terrain', 'stage-walls', 'terrain-bar', 'pit-delete', 'pit-done',
  'stage-free', 'stage-file', 'stage-mirror', 'stage-cancel-group', 'stage-dialog', 'stage-form',
  'stage-name', 'stage-width', 'stage-depth', 'stage-enemy-percent', 'stage-form-error', 'stage-close-settings',
  'arena', 'marks', 'hint', 'unit-circle', 'unit-triangle', 'unit-square', 'unit-diamond', 'unit-trapezoid', 'unit-hexagon',
  'unit-pentagon', 'unit-beamPentagon', 'unit-octagon', 'unit-wall', 'unit-piercing', 'unit-spread', 'unit-escort', 'unit-bomber', 'unit-fieldHexagon',
  'count', 'count-down', 'count-up', 'rows', 'rows-down', 'rows-up', 'undo', 'place',
  'start', 'deploy-bar', 'battle-bar', 'back', 'clock', 'result', 'verdict', 'summary', 'error',
  'zoom-out', 'zoom-in', 'view-reset', 'fullscreen', 'screen-notice'
].map(id => [id, byId(id)]));
const circle = Object.freeze({ hp: 200, damage: 75, defense: .10, penetration: 0,
  radius: .5, moveSpeed: 3.06, attackGap: .82, attackRange: 1.0625 });
const triangle = Object.freeze({ hp: 120, damage: 100, defense: 0, penetration: .20,
  radius: circle.radius, moveSpeed: circle.moveSpeed, attackGap: 1.2, attackRange: 10,
  approachRange: 9, projectileSpeed: circle.moveSpeed * 2, escortable: true });
const piercing = Object.freeze({ hp: 75, damage: 95, defense: .02, penetration: .28,
  width: 1, length: 1.45, radius: Math.hypot(.5, .725), box: true, shape: 'triangle',
  moveSpeed: 2.90, attackGap: 1.35, attackRange: 11.5, approachRange: 10.5, projectileSpeed: 7.85,
  projectileHits: 2, pierceDamageRetention: .8, escortable: true });
const spread = Object.freeze({ hp: 120, damage: 55, defense: 0, penetration: .25,
  width: 1.45, length: 1, radius: Math.hypot(.725, .5), box: true, shape: 'triangle',
  moveSpeed: 3, attackGap: 1, attackRange: 8.5, approachRange: 7.5, projectileSpeed: 5.15, homingTurnRate: Math.PI * 4 / 3,
  sideAngles: Object.freeze([-Math.PI / 10, Math.PI / 10]),
  sideAttack: Object.freeze({damage: 45, penetration: .15, projectileSpeed: 5.15}), escortable: true });
const square = Object.freeze({ hp: 265, damage: 40, defense: .40, penetration: 0,
  radius: circle.radius, moveSpeed: 2.98, attackGap: 1, attackRange: circle.attackRange });
const diamond = Object.freeze({ hp: 135, damage: 125, defense: 0, penetration: 0,
  radius: circle.radius, width: .95, length: 1.15, moveSpeed: 7.68, attackGap: 1.1,
  attackRange: circle.attackRange });
const escort = Object.freeze({ hp: 150, damage: 85, defense: .08, penetration: .02,
  width: 1.45, length: 1.05, radius: Math.hypot(.725, .525), box: true, shape: 'diamond',
  moveSpeed: 6.85, attackGap: 1.25, attackRange: circle.attackRange, escort: true });
const bomber = Object.freeze({ hp: 42, damage: 210, defense: 0, penetration: .18,
  width: .75, length: 1.45, radius: Math.hypot(.375, .725), box: true,
  moveSpeed: 8.15, attackRange: circle.attackRange,
  burst: Object.freeze({radius: 2.52, damage: 145, edgeDamage: 55, deathChance: .25}) });
const trapezoid = Object.freeze({ hp: 180, damage: 52, defense: .15, penetration: .05,
  radius: circle.radius, width: 1.25, length: 1, moveSpeed: 2.5, attackGap: .90,
  attackRange: 3.25, approachRange: 1.5, attackHalfAngle: Math.PI / 3, maxTargets: 3 });
const hexagon = Object.freeze({ large: true, hp: 280, damage: 165, defense: .05, penetration: .15,
  radius: 2.15 / 2, moveSpeed: 1.85, attackGap: 3.8, attackRange: 32.5, minAttackRange: 6,
  retreatRange: 8, projectileSpeed: 8.2,
  scatterRadius: 4.5, blastRadius: 2.65, coreRadius: 1.5, edgeDamage: 75, edgePenetration: .05,
  escortable: true });
const fieldHexagon = Object.freeze({ ...hexagon, shape: 'hexagon', damage: 75, edgeDamage: 45, attackGap: 5.2,

    ui.marks.height = Math.round(camera.h * camera.dpr);
  }
  new ResizeObserver(resize).observe(ui.arena);
  resize();
  let previous = performance.now(), accumulator = 0;
  function frame(now) {
    const dt = Math.min(.5, Math.max(0, (now - previous) / 1000));
    previous = now;
    requestAnimationFrame(frame);
    const animating = state.phase === 'battle'
      || (state.phase === 'result' && (state.impacts.length || state.units.some(unit => unit.fade || unit.hurt || unit.swing)));
    if (!needsPaint && !animating) return;
    needsPaint = false;
    if (state.impacts.length) {
      for (const impact of state.impacts) impact.remaining -= dt;
      state.impacts = state.impacts.filter(impact => impact.remaining > 0);
    }
    if (state.phase === 'battle') {
      accumulator += dt;
      while (state.phase === 'battle' && accumulator >= tick) {
        simulate();
        accumulator -= tick;
      }
    } else accumulator = 0;
    for (const unit of state.units) {
      unit.hurt = Math.max(0, unit.hurt - dt);
      unit.swing = Math.max(0, unit.swing - dt);
      unit.fade = Math.max(0, unit.fade - dt);
    }
    const selected = stageEditor.selected;
    const units = state.phase !== 'deploy' ? state.units
      : selected ? deploy.groups.filter(group => group !== selected).flatMap(group => group.units) : deploy.units;
    const preview = state.phase === 'deploy' ? deploy.preview.units : [];
    const valid = state.phase !== 'deploy' || !deploy.preview.error;
    const terrainPreview = stageEditor.terrainPreview;
    const wallPreview = stageEditor.terrainMode === 'walls' && terrainPreview && !terrainPreview.error ? terrainPreview : null;
    const walls = terrainRegions(wallPreview?.rectangles ?? arena.walls, true);
    renderer.render(units, preview, valid, state.projectiles, walls);
    drawMarks(marks, units, preview, valid, state.projectiles, walls, wallPreview);
  }
  requestAnimationFrame(frame);
}
updatePhase();
try { boot(); } catch (error) {
  console.error(error);
  ui.error.hidden = false;
  for (const button of document.querySelectorAll('button')) button.disabled = true;
}
</script>
</body>
</html>
